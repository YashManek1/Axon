openapi: 3.0.3
info:
  title: Axon API
  version: 1.0.0
  description: |
    Distributed job orchestration platform. Schedules and executes shell/HTTP jobs
    across remote Rust agents with real-time telemetry, immutable audit trail, and
    multi-tenant organisation isolation.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: User registration and session management
  - name: Jobs
    description: Job lifecycle — create, schedule, run, delete
  - name: Agents
    description: Agent provisioning and fleet management
  - name: Audit
    description: Immutable execution audit trail
  - name: Admin
    description: Platform administration (admin role required)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: axon_session
    orgApiKey:
      type: apiKey
      in: header
      name: X-Axon-API-Key

  schemas:
    User:
      type: object
      properties:
        _id:      { type: string }
        username: { type: string }
        email:    { type: string }
        role:     { type: string, enum: [user, admin] }
        orgId:    { type: string }

    Organization:
      type: object
      properties:
        _id:         { type: string }
        name:        { type: string }
        description: { type: string }

    Job:
      type: object
      properties:
        _id:         { type: string }
        name:        { type: string }
        description: { type: string }
        type:        { type: string, enum: [shell, http] }
        schedule:    { type: string, description: "Cron expression" }
        payload:     { type: object }
        enabled:     { type: boolean }
        status:      { type: string, enum: [active, paused] }
        retryLimit:  { type: integer }
        timeout:     { type: integer, description: "Seconds" }
        webhookUrl:  { type: string, nullable: true }
        notifications:
          type: object
          properties:
            onSuccess:  { type: boolean }
            onFailure:  { type: boolean }
            recipients: { type: array, items: { type: string } }
        executionWindow:
          type: object
          properties:
            enabled:    { type: boolean }
            startTime:  { type: string }
            endTime:    { type: string }
            activeDays: { type: array, items: { type: string } }
        sink:
          type: object
          properties:
            type:           { type: string, nullable: true, enum: [mongo, null] }
            uri:            { type: string, nullable: true }
            databaseName:   { type: string, nullable: true }
            collectionName: { type: string, nullable: true }
            exportFormat:   { type: array, items: { type: string } }
        orgId:     { type: string }
        userId:    { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    JobCreateRequest:
      type: object
      required: [name, type, schedule, payload]
      properties:
        name:        { type: string }
        description: { type: string }
        type:        { type: string, enum: [shell, http] }
        schedule:    { type: string }
        payload:     { type: object }
        enabled:     { type: boolean, default: true }
        retryLimit:  { type: integer, default: 0 }
        timeout:     { type: integer, default: 30 }
        webhookUrl:  { type: string }
        notifications:
          type: object
          properties:
            onSuccess:  { type: boolean }
            onFailure:  { type: boolean }
            recipients: { type: array, items: { type: string } }
        executionWindow:
          type: object
          properties:
            enabled:    { type: boolean }
            startTime:  { type: string }
            endTime:    { type: string }
            activeDays: { type: array, items: { type: string } }
        sink:         { type: object }
        dependsOn:    { type: array, items: { type: string } }

    Agent:
      type: object
      properties:
        _id:        { type: string }
        name:       { type: string }
        status:     { type: string, enum: [online, offline, busy] }
        orgId:      { type: string }
        lastSeen:   { type: string, format: date-time, nullable: true }
        systemInfo:
          type: object
          properties:
            os:       { type: string }
            arch:     { type: string }
            hostname: { type: string }
            cpuLoad:  { type: number }
            ramTotal: { type: number }
            ramUsed:  { type: number }

    AuditEntry:
      type: object
      properties:
        _id:          { type: string }
        jobId:        { type: string }
        orgId:        { type: string }
        status:       { type: string, enum: [PENDING, DISPATCHED, COMPLETED, FAILED, TIMEOUT, CANCELLED] }
        command:      { type: string }
        triggerType:  { type: string, enum: [SCHEDULED, MANUAL_API] }
        triggeredBy:
          type: object
          properties:
            userId:    { type: string }
            ipAddress: { type: string }
            userAgent: { type: string }
        startedAt:    { type: string, format: date-time }
        completedAt:  { type: string, format: date-time, nullable: true }
        durationMs:   { type: integer, nullable: true }
        exitCode:     { type: integer, nullable: true }
        stdoutSummary:{ type: string }
        stderrSummary:{ type: string }

security:
  - cookieAuth: []

paths:
  # ── Auth ──────────────────────────────────────────────────────────────
  /user/register:
    post:
      tags: [Auth]
      summary: Register user and organisation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, orgName]
              properties:
                username:        { type: string }
                email:           { type: string }
                password:        { type: string }
                orgName:         { type: string }
                orgDescription:  { type: string }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:  { $ref: '#/components/schemas/User' }
                  token: { type: string }
        '400': { description: Validation error }
        '409': { description: Email or username already exists }

  /user/login:
    post:
      tags: [Auth]
      summary: Login — sets HttpOnly session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:  { $ref: '#/components/schemas/User' }
                  token: { type: string }
        '401': { description: Invalid credentials }

  /user/logout:
    post:
      tags: [Auth]
      summary: Logout — clears session cookie
      responses:
        '200': { description: Logged out }

  /user/refresh:
    post:
      tags: [Auth]
      summary: Refresh session JWT
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:  { $ref: '#/components/schemas/User' }
                  token: { type: string }
        '401': { description: Session expired }

  # ── Jobs ──────────────────────────────────────────────────────────────
  /jobs/createJob:
    post:
      tags: [Jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  job:     { $ref: '#/components/schemas/Job' }
        '400': { description: Validation error }

  /jobs/getJobs:
    get:
      tags: [Jobs]
      summary: List jobs for authenticated user's organisation
      responses:
        '200':
          description: Jobs list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }

  /jobs/getJobById/{jobId}:
    get:
      tags: [Jobs]
      summary: Get job by ID
      parameters:
        - { in: path, name: jobId, schema: { type: string }, required: true }
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { description: Not found }

  /jobs/updateJob/{id}:
    put:
      tags: [Jobs]
      summary: Update a job
      parameters:
        - { in: path, name: id, schema: { type: string }, required: true }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  job:     { $ref: '#/components/schemas/Job' }
        '400': { description: Validation error }
        '404': { description: Not found }

  /jobs/deleteJob/{jobId}:
    delete:
      tags: [Jobs]
      summary: Delete a job
      parameters:
        - { in: path, name: jobId, schema: { type: string }, required: true }
      responses:
        '200': { description: Deleted }
        '404': { description: Not found }

  /jobs/toggleJobStatus/{jobId}:
    patch:
      tags: [Jobs]
      summary: Enable or disable a job
      parameters:
        - { in: path, name: jobId, schema: { type: string }, required: true }
      responses:
        '200': { description: Toggled }
        '404': { description: Not found }

  /jobs/runJobNow/{jobId}:
    post:
      tags: [Jobs]
      summary: Trigger a job immediately (bypasses cron schedule)
      parameters:
        - { in: path, name: jobId, schema: { type: string }, required: true }
      responses:
        '200': { description: Triggered }
        '404': { description: Not found }

  # ── Agents ────────────────────────────────────────────────────────────
  /agents/register:
    post:
      tags: [Agents]
      summary: Self-register a Rust agent (called by the agent binary, not the UI)
      security:
        - orgApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:         { type: string }
                hardwareUuid: { type: string }
      responses:
        '201':
          description: Registered — returns agentId and plain-text apiKey (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  agentId: { type: string }
                  apiKey:  { type: string }
        '401': { description: Invalid org API key }

  /agents/getAgents:
    get:
      tags: [Agents]
      summary: List all agents for authenticated user's organisation
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Agent' } }

  /agents/getAgent/{agentId}:
    get:
      tags: [Agents]
      summary: Get agent by ID
      parameters:
        - { in: path, name: agentId, schema: { type: string }, required: true }
      responses:
        '200':
          description: Agent detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '404': { description: Not found }

  /agents/{agentId}/rotate-key:
    post:
      tags: [Agents]
      summary: Rotate agent API key (admin only)
      parameters:
        - { in: path, name: agentId, schema: { type: string }, required: true }
      responses:
        '200':
          description: New key issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  agentId: { type: string }
                  apiKey:  { type: string }
        '403': { description: Admin required }
        '404': { description: Not found }

  /agents/{agentId}:
    delete:
      tags: [Agents]
      summary: Decommission an agent (admin only)
      parameters:
        - { in: path, name: agentId, schema: { type: string }, required: true }
      responses:
        '200': { description: Decommissioned }
        '403': { description: Admin required }
        '404': { description: Not found }

  # ── Audit ─────────────────────────────────────────────────────────────
  /audit/recent:
    get:
      tags: [Audit]
      summary: Recent execution activity across the organisation
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 8 } }
      responses:
        '200':
          description: Recent audit entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

  /audit/logs:
    get:
      tags: [Audit]
      summary: Flat audit log lines
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Audit log lines
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

  /audit/job/{jobId}:
    get:
      tags: [Audit]
      summary: Execution history for a specific job
      parameters:
        - { in: path,  name: jobId, schema: { type: string },  required: true }
        - { in: query, name: limit, schema: { type: integer, default: 10 } }
        - { in: query, name: skip,  schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Job run history
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

  /audit/run/{auditId}:
    get:
      tags: [Audit]
      summary: Single audit run detail
      parameters:
        - { in: path, name: auditId, schema: { type: string }, required: true }
      responses:
        '200':
          description: Audit run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntry' }
        '404': { description: Not found }

  /audit/run/{auditId}/logs:
    get:
      tags: [Audit]
      summary: Buffered log chunks for a specific run
      parameters:
        - { in: path,  name: auditId, schema: { type: string },  required: true }
        - { in: query, name: count,   schema: { type: integer, default: 100 } }
      responses:
        '200':
          description: Log chunks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    stream:      { type: string, enum: [stdout, stderr] }
                    line:        { type: string }
                    timestampMs: { type: integer }

  /audit/export:
    get:
      tags: [Audit]
      summary: Export audit history for a date range
      parameters:
        - { in: query, name: startDate, schema: { type: string }, required: true }
        - { in: query, name: endDate,   schema: { type: string }, required: true }
        - { in: query, name: limit,     schema: { type: integer, default: 500 } }
      responses:
        '200':
          description: Exported entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

  # ── Admin ─────────────────────────────────────────────────────────────
  /admin/health:
    get:
      tags: [Admin]
      summary: Platform health check (no auth required)
      security: []
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:      { type: string }
                  uptime:      { type: number }
                  dbConnected: { type: boolean }
                  dbState:     { type: integer }
                  userCount:   { type: integer, nullable: true }
                  timestamp:   { type: string, format: date-time }

  /admin/job-stats:
    get:
      tags: [Admin]
      summary: Aggregate job statistics
      responses:
        '200':
          description: Job stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalJobs:      { type: integer }
                  enabledJobs:    { type: integer }
                  disabledJobs:   { type: integer }
                  jobsRunLast24h: { type: integer }
                  jobsByOrg:
                    type: array
                    items:
                      type: object
                      properties:
                        orgId:   { type: string }
                        orgName: { type: string }
                        count:   { type: integer }

  /admin/user-stats:
    get:
      tags: [Admin]
      summary: User counts and per-user job totals
      responses:
        '200':
          description: User stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUsers: { type: integer }
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        email:    { type: string }
                        orgId:    { type: string }
                        jobCount: { type: integer }

  /admin/org-analytics:
    get:
      tags: [Admin]
      summary: Per-organisation breakdown — agents, jobs, users
      responses:
        '200':
          description: Org analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalOrgs:     { type: integer }
                  totalAgents:   { type: integer }
                  onlineAgents:  { type: integer }
                  offlineAgents: { type: integer }
                  orgs:
                    type: array
                    items:
                      type: object
                      properties:
                        orgId:          { type: string }
                        orgName:        { type: string }
                        orgDescription: { type: string }
                        createdAt:      { type: string, format: date-time }
                        userCount:      { type: integer }
                        agentCount:     { type: integer }
                        onlineAgents:   { type: integer }
                        offlineAgents:  { type: integer }
                        shellJobCount:  { type: integer }
                        httpJobCount:   { type: integer }
                        totalJobCount:  { type: integer }

  /admin/all-jobs:
    get:
      tags: [Admin]
      summary: All jobs across all organisations
      responses:
        '200':
          description: All jobs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }

  /admin/all-users:
    get:
      tags: [Admin]
      summary: All users across all organisations
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }