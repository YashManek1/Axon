name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  agent-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    needs: [backend-test, agent-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t axon-backend:${{ github.sha }} ./backend
      - name: Build agent image
        run: docker build -t axon-agent:${{ github.sha }} ./agent
      - name: Build frontend image
        run: docker build -t axon-frontend:${{ github.sha }} ./frontend
      - name: Tag latest images on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag axon-backend:${{ github.sha }} axon-backend:latest
          docker tag axon-agent:${{ github.sha }} axon-agent:latest
          docker tag axon-frontend:${{ github.sha }} axon-frontend:latest
