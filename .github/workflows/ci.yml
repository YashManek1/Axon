name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Use Node.js 24 for GitHub Actions runner to avoid deprecation breakage (June 16 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  agent-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL build deps
        run: sudo apt-get update -y && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      # tsc -b follows project references (tsconfig.app.json) and matches the
      # Docker build command (tsc -b && vite build). Using --noEmit here was a
      # no-op because tsconfig.json has "files": [] at the root level.
      - run: npx tsc -b

  build:
    runs-on: ubuntu-latest
    needs: [backend-test, agent-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t axon-backend:${{ github.sha }} ./backend
      - name: Build agent image
        run: docker build -t axon-agent:${{ github.sha }} ./agent
      - name: Build frontend image
        run: docker build -t axon-frontend:${{ github.sha }} ./frontend
      - name: Tag latest images on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag axon-backend:${{ github.sha }} axon-backend:latest
          docker tag axon-agent:${{ github.sha }} axon-agent:latest
          docker tag axon-frontend:${{ github.sha }} axon-frontend:latest
